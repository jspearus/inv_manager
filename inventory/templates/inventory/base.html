{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Hardware Store{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'inventory/style.css' %}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{% url 'inventory:component_list' %}">Hardware Store</a>
  </header>
  <main class="page">
    {% if messages %}
      <div class="messages">
        {% for message in messages %}<p class="message">{{ message }}</p>{% endfor %}
      </div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
